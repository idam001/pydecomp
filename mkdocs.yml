site_name: pydecomp
site_description: Static Python deobfuscator — recover readable source from packed, encoded or compiled Python without executing it.
site_url: https://pydecomp.github.io/pydecomp/
repo_url: https://github.com/idam001/pydecomp
repo_name: pydecomp/pydecomp
edit_uri: edit/main/docs/
copyright: MIT licensed · built by Idam Emmanuel

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting started:
      - Install: install.md
      - Termux (Android): termux.md
      - Tested against a packer: adversarial.md
      - What it cannot do: limits.md
      - Quick start: quickstart.md
      - CLI reference: cli.md
  - How it works:
      - The Almighty engine: almighty.md
      - Architecture: architecture.md
      - Layers and containers: layers.md
      - Bytecode engine: bytecode.md
      - Expression evaluator: evaluator.md
  - Reference:
      - API: api.md
      - Native and ELF: native.md
  - Project:
      - Development: development.md
      - What I would upgrade next: UPGRADES.md
      - FAQ: faq.md
      - Roadmap: roadmap.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

validation:
  links:
    absolute_links: relative_to_docs
    anchors: warn
  omitted_files: warn
  absolute_links: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/idam001/pydecomp
  generator: false
