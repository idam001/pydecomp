name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 3"          # Wednesdays
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyse:
    name: analyse python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          # pydecomp parses hostile input; be aggressive about the query pack.
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
