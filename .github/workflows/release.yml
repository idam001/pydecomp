name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build everything, publish nothing"
        type: boolean
        default: true

permissions:
  contents: write          # create the release
  id-token: write          # PyPI trusted publishing
  packages: write          # GHCR

env:
  PYTHONPATH: src
  NO_COLOR: "1"

jobs:
  verify:
    name: verify the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: version in the tag matches the package
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(PYTHONPATH=src python -c "import pydecomp;print(pydecomp.__version__)")
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg"
      - name: the changelog mentions this version
        run: grep -q "## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md
      - name: all gates
        run: python3 tools/run_gates.py
      - name: single file is current
        run: python3 tools/build_single.py --check

  build:
    name: build distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install build twine
      - run: python -m build
      - run: python3 tools/build_single.py
      - name: check the metadata
        run: twine check dist/*
      - name: install the wheel in a clean venv and run it
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/pydecomp --version
          /tmp/venv/bin/pydecomp --selftest --no-color
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/pydecomp.py

  pypi:
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pydecomp
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: [build, pypi]
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: notes from the changelog
        run: |
          python - <<'PY'
          import pathlib, re
          text = pathlib.Path("CHANGELOG.md").read_text()
          version = "${{ github.ref_name }}".lstrip("v")
          body = text.split(f"## [{version}]", 1)[1].split("## [", 1)[0]
          pathlib.Path("notes.md").write_text(body.strip())
          PY
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/pydecomp.py
          fail_on_unmatched_files: true
