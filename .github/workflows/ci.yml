name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: unit tests
        run: PYTHONPATH=src python -m pytest tests/unit -q
      - name: audit (nothing executes a sample)
        run: python tools/check_static_only.py
      - name: single-file build is current
        run: python tools/build_single.py --check
      - name: gates
        run: python tools/run_gates.py
      - name: the shipped single file runs on a clean machine
        run: |
          cd "$(mktemp -d)"
          printf 'import base64\nprint(base64.b64decode("cHJvb2Y=").decode())\n' > s.py
          python "$GITHUB_WORKSPACE/dist/pydecomp.py" s.py -o out --no-color --no-anim
          test -f out/s_deob.py
          test -f out/s_deob.proof.json
