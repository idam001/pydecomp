name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is the floor pyproject claims, but it is no longer on
          # ubuntu-latest, so it gets the older runner image
          - { os: ubuntu-22.04, python: "3.9" }
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml
      - name: unit tests
        run: PYTHONPATH=src python -m pytest tests/unit -q
      - name: audit (nothing executes a sample)
        run: python tools/check_static_only.py
      - name: single-file build is current
        run: python tools/build_single.py --check
      - name: gates
        run: python tools/run_gates.py
      - name: the shipped single file runs on a clean machine
        run: |
          cd "$(mktemp -d)"
          printf 'import base64\nprint(base64.b64decode("cHJvb2Y=").decode())\n' > s.py
          python "$GITHUB_WORKSPACE/dist/pydecomp.py" s.py -o out --no-color --no-anim
          test -f out/s_deob.py
          test -f out/s_deob.proof.json
          python "$GITHUB_WORKSPACE/dist/pydecomp.py" --check-proof out/s_deob.proof.json

  # the version table the bytecode reader ships is generated from a real
  # interpreter; if the tables and the generator disagree, one of them is stale
  tables:
    name: opcode tables are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tools/gen_opcode_tables.py --check

  # a fresh clone must be able to reproduce the evidence images byte for byte
  evidence:
    name: evidence still describes these files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pillow
      - run: python tools/build_single.py --check
      - run: python tools/make_evidence.py --check
