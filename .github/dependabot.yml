version: 2
updates:
  # Python runtime has zero dependencies; these are the dev/tooling ones.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      dev-tooling:
        patterns: ["pytest*", "ruff", "mypy", "pre-commit"]
      docs-tooling:
        patterns: ["mkdocs*", "mkdocstrings*", "pymdown-extensions"]
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "build"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "build"
